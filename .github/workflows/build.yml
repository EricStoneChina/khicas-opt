name: Build Khicas Opt

# 编译方式说明:
#   两种方式都支持 ——
#   1. 本地:  Linux/WSL2 里跑 ./build.sh(见 README)
#   2. CI:     本文件 —— 推到 GitHub 后自动构建,产物可下载
#   推荐:日常迭代用本地 WSL(快、灵活),正式发版用 CI(可复现、留档)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 工具链依赖(casiolocal 231MB + mkg3a)缓存,避免每次重新下载
      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/khicas-toolchain
          key: khicas-toolchain-v1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake zlib1g-dev libpng-dev curl wget build-essential

      - name: Build (optimized config)
        run: |
          chmod +x build.sh
          ./build.sh
        env:
          JOBS: 4

      - name: Report sizes
        run: |
          echo "=== khicas50 主段 .g3a ==="
          ls -la giacbf/khicas50.g3a
          echo "=== khicas50 第二段 .ac2 ==="
          ls -la giacbf/khicas50.ac2
          echo "=== khicaszh 中文版 .g3a ==="
          ls -la giacbf/khicaszh.g3a
          echo "=== khicaszh 中文版 .ac2 ==="
          ls -la giacbf/khicaszh.ac2
          echo "=== 内存占用(khicas50)==="
          grep -A4 "Memory region" giacbf/khicas.map 2>/dev/null || true
          echo "=== 内存占用(khicaszh)==="
          grep -A4 "Memory region" giacbf/khicaszh.map 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: khicas50-optimized
          path: |
            giacbf/khicas50.g3a
            giacbf/khicas50.ac2
          if-no-files-found: error

      - name: Upload Chinese artifacts
        uses: actions/upload-artifact@v4
        with:
          name: khicaszh-chinese
          path: |
            giacbf/khicaszh.g3a
            giacbf/khicaszh.ac2
          if-no-files-found: error


