name: KhiCAS 2026a checks

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-check:
    name: Source and native checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize official snapshot ref
        run: git fetch origin upstream/khicas-2026-07-31:refs/heads/upstream/khicas-2026-07-31

      - name: Check official snapshot registration
        run: python tests/check-registration.py

      - name: Run native arithmetic checks
        run: python tests/run-native.py
